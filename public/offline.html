<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6d28d9" />
    <title>Sin conexión · Cloud Esther</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #faf9ff; color: #1f1535; }
      @media (prefers-color-scheme: dark) { body { background: #140b2e; color: #f3eefe; } p { color: #c9bfe6 !important; } }
      .card { max-width: 360px; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 20px; margin: 16px 0 6px; }
      p { color: #6b6280; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      button { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 14px;
        background: linear-gradient(135deg, #8b3de0, #6d28d9); color: #fff; min-height: 44px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/favicon.svg" alt="" />
      <h1>Estás sin conexión</h1>
      <p>Cloud Esther necesita internet para mostrar los datos actualizados. Revisá tu conexión y volvé a intentar.</p>
      <button onclick="location.reload()">Volver a intentar</button>
    </div>
  </body>
</html>
